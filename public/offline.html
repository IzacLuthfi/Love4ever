<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#083b59"
    />

    <title>
      Love4ever · Offline
    </title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        background: #f7f7f4;

        color: #083b59;

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .page {
        width: 100%;
        max-width: 420px;

        text-align: center;
      }

      .mark {
        width: 52px;
        height: 52px;

        margin: 0 auto 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 16px;

        background: #083b59;

        color: white;

        font-size: 22px;
        font-weight: 600;
      }

      h1 {
        margin: 0;

        font-family:
          Georgia,
          "Times New Roman",
          serif;

        font-size: clamp(
          34px,
          8vw,
          44px
        );

        line-height: 1;

        letter-spacing:
          -0.04em;

        font-weight: 600;
      }

      p {
        margin: 16px auto 0;

        max-width: 310px;

        color: #69808e;

        font-size: 14px;
        line-height: 1.7;
      }

      button {
        width: 100%;

        margin-top: 32px;

        border: 0;

        border-radius: 14px;

        padding: 14px 20px;

        background: #083b59;

        color: white;

        font: inherit;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
      }

      button:hover {
        background: #0d4e70;
      }

      .footer {
        margin-top: 28px;

        color: #9aa9b1;

        font-size: 10px;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="mark">
        L
      </div>

      <h1>
        You're offline.
      </h1>

      <p>
        Love4ever needs an internet
        connection to sync your data.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        Try again
      </button>

      <div class="footer">
        Love4ever
      </div>
    </main>
  </body>
</html>
